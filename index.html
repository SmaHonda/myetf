<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETF 股息資產管家</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            morandi: {
              bg: '#F4F5F7',
              card: '#FFFFFF',
              primary: '#2B3A4A',
              secondary: '#6B7C85',
              accent: '#5A8F7B',
              lightAccent: '#E8F0EC',
              border: '#E2E8F0',
              text: '#1E293B',
              muted: '#64748B'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F4F5F7;
      color: #1E293B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .active-tab {
      color: #2B3A4A;
      border-bottom: 2px solid #2B3A4A;
      font-weight: 600;
    }
  </style>
</head>
<body class="pb-20 max-w-md mx-auto min-h-screen shadow-lg relative bg-[#F4F5F7]">

  <!-- 頂部標題列 -->
  <header class="bg-morandi-primary text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
    <div>
      <h1 class="text-lg font-bold tracking-wide">ETF 股息資產管家</h1>
      <p class="text-xs text-slate-300">雲端同步狀態：<span id="sync-status" class="text-morandi-accent font-medium">連線正常</span></p>
    </div>
    <button onclick="fetchSheetData()" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded border border-slate-500 transition">
      重新整理
    </button>
  </header>

  <!-- 主頁面分頁切換選單 -->
  <nav class="bg-white border-b border-morandi-border sticky top-[57px] z-40 flex justify-around text-sm text-morandi-muted">
    <button id="tab-btn-dashboard" onclick="switchTab('dashboard')" class="py-3 px-2 active-tab">投資總覽</button>
    <button id="tab-btn-history" onclick="switchTab('history')" class="py-3 px-2">股息歷程</button>
    <button id="tab-btn-calendar" onclick="switchTab('calendar')" class="py-3 px-2">股息日曆</button>
    <button id="tab-btn-journal" onclick="switchTab('journal')" class="py-3 px-2">買賣紀錄</button>
  </nav>

  <!-- 主要內容區塊 -->
  <main class="p-4 space-y-4">

    <!-- 1. 投資總覽 (Dashboard) -->
    <section id="sec-dashboard" class="space-y-4">
      <div class="bg-morandi-primary text-white rounded-xl p-5 shadow-sm space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-xs text-slate-300">總投資價值 (估計)</span>
          <span class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-200">即時同步</span>
        </div>
        <div class="text-3xl font-bold tracking-tight" id="dash-total-value">$0</div>

        <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-700/60">
          <div>
            <div class="text-slate-400">總投入成本</div>
            <div class="text-sm font-semibold text-slate-100" id="dash-total-cost">$0</div>
          </div>
          <div>
            <div class="text-slate-400">歷史總配息 (自動試算)</div>
            <div class="text-sm font-semibold text-morandi-accent" id="dash-total-dividend">$0</div>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-2">
        <h2 class="text-xs font-bold text-morandi-muted tracking-wider uppercase">持股統計</h2>
        <div class="grid grid-cols-4 gap-2 text-center pt-1" id="holding-summary-counts">
          <div class="bg-slate-50 p-2 rounded">
            <div class="text-[10px] text-slate-500">持股筆數</div>
            <div class="text-sm font-bold text-morandi-primary" id="count-holdings">0</div>
          </div>
          <div class="bg-slate-50 p-2 rounded">
            <div class="text-[10px] text-slate-500">總股數</div>
            <div class="text-sm font-bold text-morandi-primary" id="count-shares">0</div>
          </div>
          <div class="bg-slate-50 p-2 rounded">
            <div class="text-[10px] text-slate-500">已領息次數</div>
            <div class="text-sm font-bold text-morandi-primary" id="count-div-times">0</div>
          </div>
          <div class="bg-slate-50 p-2 rounded">
            <div class="text-[10px] text-slate-500">累計配息總額</div>
            <div class="text-sm font-bold text-morandi-primary" id="avg-monthly-div">$0</div>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-3">
        <h2 class="text-xs font-bold text-morandi-muted tracking-wider uppercase">持股佔比分析</h2>
        <div class="w-48 h-48 mx-auto">
          <canvas id="chart-portfolio"></canvas>
        </div>
      </div>

      <!-- 新增：個別持股清單 -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-2">
        <h2 class="text-xs font-bold text-morandi-muted tracking-wider uppercase">個別持股績效 (股息結算)</h2>
        <div id="dashboard-holdings-list" class="divide-y divide-slate-100">
          <p class="text-slate-400 text-center py-4 text-xs">載入中...</p>
        </div>
      </div>
    </section>

    <!-- 2. 股息歷程 (History) -->
    <section id="sec-history" class="space-y-4 hidden">
      <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-morandi-border">
        <span class="text-xs font-bold text-morandi-primary">選擇統計年份</span>
        <select id="history-year-select" onchange="renderHistory()" class="text-xs border border-slate-200 rounded px-2 py-1 bg-slate-50 font-medium">
          <option value="2026">2026 年</option>
          <option value="2025">2025 年</option>
          <option value="2024">2024 年</option>
          <option value="2023">2023 年</option>
          <option value="2022">2022 年</option>
          <option value="2021">2021 年</option>
          <option value="2020">2020 年</option>
        </select>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-morandi-primary" id="history-chart-title">各月份領息統計</h2>
          <span class="text-xs text-morandi-accent font-semibold" id="history-year-total">該年總計: $0</span>
        </div>
        <div class="h-52">
          <canvas id="chart-dividend-history"></canvas>
        </div>
      </div>

      <p class="text-[10px] text-slate-400 px-1">點選下方月份（或長條圖）可查看該月各檔個股的配息明細</p>
      <div class="space-y-3" id="history-timeline-list"></div>
    </section>

    <!-- 3. 股息日曆 (Calendar) -->
    <section id="sec-calendar" class="space-y-4 hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-2">
        
        <!-- 日曆控制列與圖例 -->
        <div class="flex justify-between items-center mb-1">
          <button onclick="changeCalendarMonth(-1)" class="p-1 px-3 text-slate-500 hover:bg-slate-100 rounded transition font-bold">&lt;</button>
          <div class="text-center">
            <h2 class="text-sm font-bold text-morandi-primary" id="calendar-month-title">-- 年 -- 月</h2>
            <div class="flex items-center justify-center gap-2 text-[10px] text-slate-500 mt-1">
              <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>除息</span>
              <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-morandi-accent"></span>發放</span>
            </div>
          </div>
          <button onclick="changeCalendarMonth(1)" class="p-1 px-3 text-slate-500 hover:bg-slate-100 rounded transition font-bold">&gt;</button>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 font-bold py-1 border-b border-slate-100 pb-2">
          <div class="text-rose-500">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-morandi-accent">六</div>
        </div>
        
        <!-- 網格生成處 -->
        <div class="grid grid-cols-7 gap-1 text-center text-xs mt-2" id="calendar-grid"></div>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-2 min-h-[150px]">
        <div id="calendar-events-list" class="space-y-2 text-xs">
          <!-- 當日行程將會渲染在這裡 -->
          <p class="text-slate-400 py-2">載入中...</p>
        </div>
      </div>
    </section>

    <!-- 4. 買賣紀錄管理 (Journal) -->
    <section id="sec-journal" class="space-y-4 hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-3">
        <h2 class="text-sm font-bold text-morandi-primary flex justify-between items-center">
          新增買賣交易紀錄
          <span class="text-[10px] font-normal text-slate-400">同步至 Google 試算表</span>
        </h2>
        <form id="trade-form" onsubmit="submitTrade(event)" class="space-y-3 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-500 mb-1">交易日期</label>
              <input type="date" id="input-date" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
            <div>
              <label class="block text-slate-500 mb-1">動作</label>
              <select id="input-action" class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary bg-white">
                <option value="買進">買進</option>
                <option value="賣出">賣出</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-500 mb-1">股票代號</label>
              <input type="text" id="input-symbol" placeholder="例: 00878 或 0056" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
            <div>
              <label class="block text-slate-500 mb-1">股票名稱</label>
              <input type="text" id="input-name" placeholder="例: 國泰永續高股息" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-slate-500 mb-1">成交單價</label>
              <input type="number" step="0.01" id="input-price" placeholder="22.5" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
            <div>
              <label class="block text-slate-500 mb-1">股數</label>
              <input type="number" id="input-shares" placeholder="1000" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
            <div>
              <label class="block text-slate-500 mb-1">手續費</label>
              <input type="number" id="input-fee" placeholder="0" class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-morandi-primary text-white py-2.5 rounded font-medium shadow-sm hover:bg-slate-800 transition">
            儲存紀錄至雲端試算表
          </button>
        </form>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-3">
        <h2 class="text-sm font-bold text-morandi-primary">已同步買賣紀錄</h2>
        <div id="journal-list" class="space-y-2 text-xs divide-y divide-slate-100">
          <p class="text-slate-400 text-center py-4">連線中，載入資料庫中...</p>
        </div>
      </div>
    </section>

  </main>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrlB_2SXpITgtdH_yuMAvOp4Z_KCpoej3UvnBYWcnl1RWYWF7ddbOpE2xbr3CIoZt3/exec";

    let rawTradeData = [];
    let dividendDatabase = {};
    let calculatedDividends = [];
    
    // 圖表與狀態
    let portfolioChart = null;
    let historyChart = null;
    let currentYearDividends = [];   
    let historyDrilldownMonth = null; 

    // 日曆專用狀態
    let currentCalDate = new Date(); // 畫面上顯示的月份基準點
    let selectedCalDate = new Date(); // 使用者點選的特定日期

    function cleanSymbol(rawSymbol) {
      if (!rawSymbol) return "";
      return String(rawSymbol).trim().replace(/['"']/g, '');
    }

    // 取得 YYYY-MM-DD 格式 (以本地時間為主，避免 UTC 時差問題)
    function getLocalYMD(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    window.onload = function() {
      document.getElementById('input-date').valueAsDate = new Date();
      fetchSheetData();
    };

    function switchTab(tabName) {
      ['dashboard', 'history', 'calendar', 'journal'].forEach(tab => {
        document.getElementById(`sec-${tab}`).classList.add('hidden');
        document.getElementById(`tab-btn-${tab}`).classList.remove('active-tab');
      });
      document.getElementById(`sec-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${tabName}`).classList.add('active-tab');

      if (tabName === 'dashboard') renderDashboard();
      if (tabName === 'history') renderHistory();
      if (tabName === 'calendar') renderCalendar();
    }

    async function fetchSheetData() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = "同步中...";
      statusEl.className = "text-amber-400 font-medium";

      try {
        const noCacheUrl = GAS_API_URL + "?t=" + new Date().getTime();
        const res = await fetch(noCacheUrl, { method: 'GET', redirect: 'follow' });
        const resJson = await res.json();

        if (Array.isArray(resJson)) {
          rawTradeData = resJson;
          dividendDatabase = {};
        } else {
          rawTradeData = resJson.trades || [];
          dividendDatabase = resJson.dividends || {};
        }

        statusEl.innerText = "計算配息中...";
        calculateUserDividends();

        statusEl.innerText = "同步完成";
        statusEl.className = "text-morandi-accent font-medium";

        renderJournalList();
        renderDashboard();
        
        // 確保在背景載入完畢後，日曆與歷程也有最新資料
        if (!document.getElementById('sec-history').classList.contains('hidden')) renderHistory();
        if (!document.getElementById('sec-calendar').classList.contains('hidden')) renderCalendar();

      } catch (err) {
        console.error("同步失敗：", err);
        statusEl.innerText = "同步失敗";
        statusEl.className = "text-rose-400 font-medium";
      }
    }

    function calculateUserDividends() {
      calculatedDividends = [];
      const buyTrades = rawTradeData.filter(t => t['動作'] === '買進');

      const symbolTrades = {};
      buyTrades.forEach(trade => {
        const symbol = cleanSymbol(trade['股票代號']);
        const buyDateStr = String(trade['日期']).split('T')[0];
        const buyDate = new Date(buyDateStr);
        const shares = Number(trade['股數']) || 0;

        if (!symbolTrades[symbol]) {
          symbolTrades[symbol] = { name: trade['股票名稱'] || symbol, trades: [] };
        }
        symbolTrades[symbol].trades.push({ buyDate, shares });
      });

      Object.keys(symbolTrades).forEach(symbol => {
        const info = symbolTrades[symbol];
        const rawDivList = dividendDatabase[symbol] || [];

        rawDivList.forEach(item => {
          const cashAmount = (Number(item.CashEarningsDistribution) || 0) + (Number(item.CashStatutorySurplus) || 0);
          const exDateStr = item.CashExDividendTradingDate || item.date;
          const payDateStr = item.CashDividendPaymentDate || exDateStr;

          if (cashAmount <= 0 || !exDateStr) return;

          const exDate = new Date(exDateStr);
          if (isNaN(exDate)) return;

          let totalShares = 0;
          info.trades.forEach(t => {
            if (!isNaN(t.buyDate) && t.buyDate <= exDate) {
              totalShares += t.shares;
            }
          });

          if (totalShares > 0) {
            const totalPayout = Math.round(totalShares * cashAmount);
            const dateParts = payDateStr.split('-');

            calculatedDividends.push({
              symbol: symbol,
              name: info.name,
              exDate: exDateStr,
              payDate: payDateStr,
              year: dateParts[0],
              month: dateParts[1],
              shares: totalShares,
              perShare: cashAmount,
              totalPayout: totalPayout
            });
          }
        });
      });
    }

    function submitTrade(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "寫入中...";

      const payload = {
        date: document.getElementById('input-date').value,
        action: document.getElementById('input-action').value,
        symbol: document.getElementById('input-symbol').value.trim(),
        name: document.getElementById('input-name').value.trim(),
        price: document.getElementById('input-price').value,
        shares: document.getElementById('input-shares').value,
        fee: document.getElementById('input-fee').value || 0
      };

      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("成功新增交易紀錄！");
        document.getElementById('trade-form').reset();
        document.getElementById('input-date').valueAsDate = new Date();
        fetchSheetData();
      })
      .catch(err => {
        alert("寫入失敗，請檢查網路連線。");
        console.error(err);
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "儲存紀錄至雲端試算表";
      });
    }

    function renderJournalList() {
      const container = document.getElementById('journal-list');
      if (!rawTradeData || rawTradeData.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-center py-4">目前 Google 試算表中無交易資料</p>`;
        return;
      }

      container.innerHTML = rawTradeData.slice().reverse().map(item => `
        <div class="pt-2 flex justify-between items-center">
          <div>
            <div class="font-bold text-morandi-primary">${cleanSymbol(item['股票代號'])} ${item['股票名稱'] || ''}</div>
            <div class="text-[10px] text-slate-400">${item['日期']} | <span class="${item['動作'] === '買進' ? 'text-emerald-600' : 'text-rose-600'} font-medium">${item['動作']}</span></div>
          </div>
          <div class="text-right">
            <div class="font-semibold text-morandi-text">$${Number(item['單價']).toLocaleString()} × ${Number(item['股數']).toLocaleString()}股</div>
            <div class="text-[10px] text-slate-400">手續費: $${Number(item['手續費'] || 0)}</div>
          </div>
        </div>
      `).join('');
    }

    function renderDashboard() {
      let totalCost = 0;
      let totalShares = 0;
      let holdings = {};

      // 1. 整理買進紀錄，並找出最初買進日
      rawTradeData.forEach(item => {
        const symbol = cleanSymbol(item['股票代號']);
        const shares = Number(item['股數']) || 0;
        const price = Number(item['單價']) || 0;
        const fee = Number(item['手續費']) || 0;
        const tradeDateStr = String(item['日期']).split('T')[0];
        const tradeDate = new Date(tradeDateStr);

        if (!holdings[symbol]) {
          holdings[symbol] = { 
            shares: 0, 
            cost: 0, 
            name: item['股票名稱'],
            totalDividend: 0,
            firstBuyDate: tradeDate
          };
        }

        if (item['動作'] === '買進') {
          holdings[symbol].shares += shares;
          holdings[symbol].cost += (shares * price) + fee;
          totalCost += (shares * price) + fee;
          totalShares += shares;
          
          if (!isNaN(tradeDate) && tradeDate < holdings[symbol].firstBuyDate) {
              holdings[symbol].firstBuyDate = tradeDate;
          }
        }
      });

      // 2. 結算各股配息
      calculatedDividends.forEach(d => {
        if (holdings[d.symbol]) {
          holdings[d.symbol].totalDividend += d.totalPayout;
        }
      });

      const totalHistoricalDiv = calculatedDividends.reduce((sum, d) => sum + d.totalPayout, 0);

      document.getElementById('dash-total-cost').innerText = `$${Math.round(totalCost).toLocaleString()}`;
      document.getElementById('dash-total-value').innerText = `$${Math.round(totalCost).toLocaleString()}`;
      document.getElementById('dash-total-dividend').innerText = `$${totalHistoricalDiv.toLocaleString()}`;

      document.getElementById('count-holdings').innerText = Object.keys(holdings).length;
      document.getElementById('count-shares').innerText = totalShares.toLocaleString();
      document.getElementById('count-div-times').innerText = calculatedDividends.length;
      document.getElementById('avg-monthly-div').innerText = `$${totalHistoricalDiv.toLocaleString()}`;

      // 3. 更新圖表
      const labels = Object.keys(holdings).filter(s => holdings[s].shares > 0);
      const dataValues = labels.map(s => holdings[s].cost);

      const ctx = document.getElementById('chart-portfolio').getContext('2d');
      if (portfolioChart) portfolioChart.destroy();

      portfolioChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: ['#2B3A4A', '#5A8F7B', '#6B7C85', '#94A3B8', '#CBD5E1']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
          }
        }
      });

      // 4. 渲染個別持股清單
      const listEl = document.getElementById('dashboard-holdings-list');
      let html = '';
      const today = new Date();

      labels.forEach(symbol => {
          const h = holdings[symbol];
          const roi = h.cost > 0 ? (h.totalDividend / h.cost) : 0;
          const roiPercent = (roi * 100).toFixed(2);
          
          let annualizedRoiPercent = "0.00";
          if (h.firstBuyDate && !isNaN(h.firstBuyDate)) {
              const daysHeld = (today - h.firstBuyDate) / (1000 * 60 * 60 * 24);
              if (daysHeld > 0) {
                  const annRoi = Math.pow(1 + roi, 365.25 / daysHeld) - 1;
                  // 若持有天數不到 30 天，為避免失真，直接顯示總報酬率
                  if (daysHeld < 30) {
                      annualizedRoiPercent = roiPercent; 
                  } else {
                      annualizedRoiPercent = (annRoi * 100).toFixed(2);
                  }
              }
          }

          html += `
            <div class="pt-3 pb-2">
              <div class="flex justify-between items-center mb-2">
                <div class="font-bold text-morandi-primary text-sm">${symbol} ${h.name}</div>
                <div class="text-right">
                  <span class="text-sm font-bold text-morandi-accent">${roiPercent}%</span>
                  <span class="text-[10px] text-slate-400 block">總股息報酬率</span>
                </div>
              </div>
              <div class="grid grid-cols-4 gap-2 text-center">
                <div class="bg-slate-50 p-2 rounded border border-slate-100">
                  <div class="text-[10px] text-slate-500 mb-0.5">總股數</div>
                  <div class="font-bold text-slate-700 text-xs">${h.shares.toLocaleString()}</div>
                </div>
                <div class="bg-slate-50 p-2 rounded border border-slate-100">
                  <div class="text-[10px] text-slate-500 mb-0.5">投入成本</div>
                  <div class="font-bold text-slate-700 text-xs">$${Math.round(h.cost).toLocaleString()}</div>
                </div>
                <div class="bg-slate-50 p-2 rounded border border-slate-100">
                  <div class="text-[10px] text-slate-500 mb-0.5">總配息</div>
                  <div class="font-bold text-morandi-accent text-xs">+$${h.totalDividend.toLocaleString()}</div>
                </div>
                <div class="bg-slate-50 p-2 rounded border border-slate-100">
                  <div class="text-[10px] text-slate-500 mb-0.5">年化(股息)</div>
                  <div class="font-bold ${parseFloat(annualizedRoiPercent) > 0 ? 'text-morandi-accent' : 'text-slate-700'} text-xs">${annualizedRoiPercent}%</div>
                </div>
              </div>
            </div>
          `;
      });

      listEl.innerHTML = html || '<div class="text-center text-slate-400 py-4 text-xs">目前無持股資料</div>';
    }

    function computeMonthlyPayouts() {
      const monthlyPayouts = Array(12).fill(0);
      currentYearDividends.forEach(d => {
        const m = parseInt(d.month, 10) - 1;
        if (m >= 0 && m < 12) monthlyPayouts[m] += d.totalPayout;
      });
      return monthlyPayouts;
    }

    function renderHistory() {
      const selectedYear = document.getElementById('history-year-select').value;
      historyDrilldownMonth = null;
      currentYearDividends = calculatedDividends.filter(d => d.year === selectedYear);

      const monthlyPayouts = computeMonthlyPayouts();
      const yearTotal = monthlyPayouts.reduce((sum, v) => sum + v, 0);

      document.getElementById('history-year-total').innerText = `${selectedYear} 總計: $${yearTotal.toLocaleString()}`;

      const ctx = document.getElementById('chart-dividend-history').getContext('2d');
      if (historyChart) historyChart.destroy();

      historyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
          datasets: [{
            label: `${selectedYear} 實領配息 (元)`,
            data: monthlyPayouts,
            backgroundColor: '#5A8F7B',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, grid: { color: '#F1F5F9' } },
            x: { grid: { display: false } }
          },
          plugins: { legend: { display: false } },
          onClick: (evt, elements) => {
            if (elements.length > 0) {
              const idx = elements[0].index;
              if (monthlyPayouts[idx] > 0) {
                showMonthDetail(selectedYear, String(idx + 1).padStart(2, '0'));
              }
            }
          }
        }
      });

      renderHistoryList(selectedYear);
    }

    function renderHistoryList(selectedYear) {
      const timelineEl = document.getElementById('history-timeline-list');
      if (historyDrilldownMonth) {
        renderMonthDetail(timelineEl, selectedYear);
      } else {
        renderMonthSummary(timelineEl, selectedYear);
      }
    }

    function renderMonthSummary(timelineEl, selectedYear) {
      const monthlyPayouts = computeMonthlyPayouts();
      const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

      let html = '';
      for (let i = 0; i < 12; i++) {
        if (monthlyPayouts[i] <= 0) continue;
        const monthStr = String(i + 1).padStart(2, '0');
        const countInMonth = currentYearDividends.filter(d => d.month === monthStr).length;

        html += `
          <button onclick="showMonthDetail('${selectedYear}', '${monthStr}')" class="w-full text-left bg-white rounded-xl p-3 shadow-sm border border-morandi-border flex justify-between items-center text-xs hover:border-morandi-accent transition">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-morandi-lightAccent flex items-center justify-center text-morandi-accent font-bold text-xs shrink-0">${monthNames[i]}</div>
              <div>
                <div class="font-bold text-morandi-primary">${selectedYear} 年 ${monthNames[i]}</div>
                <div class="text-[10px] text-slate-400">共 ${countInMonth} 筆配息</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <div class="text-sm font-bold text-morandi-accent">+$${monthlyPayouts[i].toLocaleString()}</div>
              <span class="text-slate-300 text-base">›</span>
            </div>
          </button>
        `;
      }

      timelineEl.innerHTML = html || `<p class="text-slate-400 text-center py-4 text-xs">該年份無領息紀錄</p>`;
    }

    function renderMonthDetail(timelineEl, selectedYear) {
      const monthStr = historyDrilldownMonth;
      const monthLabel = `${selectedYear} 年 ${parseInt(monthStr, 10)} 月`;
      const monthDividends = currentYearDividends
        .filter(d => d.month === monthStr)
        .sort((a, b) => (a.exDate > b.exDate ? 1 : a.exDate < b.exDate ? -1 : 0));

      let html = `
        <div class="flex items-center justify-between px-1">
          <button onclick="backToMonthSummary('${selectedYear}')" class="flex items-center gap-1 text-xs text-morandi-secondary hover:text-morandi-primary font-medium">
            <span>←</span><span>返回月份總覽</span>
          </button>
          <span class="text-xs font-bold text-morandi-primary">${monthLabel} 配息明細</span>
        </div>
      `;

      if (monthDividends.length === 0) {
        html += `<p class="text-slate-400 text-center py-4 text-xs">該月份無領息紀錄</p>`;
      } else {
        html += monthDividends.map(d => `
          <div class="bg-white rounded-xl p-3 shadow-sm border border-morandi-border flex justify-between items-center text-xs">
            <div>
              <div class="font-bold text-morandi-primary">${d.symbol} ${d.name}</div>
              <div class="text-[10px] text-slate-400">發放日：${d.payDate}（除息：${d.exDate}）</div>
              <div class="text-[10px] text-slate-500">每股配息 $${d.perShare} × ${d.shares.toLocaleString()} 股</div>
            </div>
            <div class="text-right">
              <div class="text-sm font-bold text-morandi-accent">+$${d.totalPayout.toLocaleString()}</div>
              <div class="text-[10px] bg-morandi-lightAccent text-morandi-accent px-1.5 py-0.5 rounded inline-block mt-1">自動試算</div>
            </div>
          </div>
        `).join('');
      }

      timelineEl.innerHTML = html;
    }

    function showMonthDetail(selectedYear, monthStr) {
      historyDrilldownMonth = monthStr;
      renderHistoryList(selectedYear);
    }

    function backToMonthSummary(selectedYear) {
      historyDrilldownMonth = null;
      renderHistoryList(selectedYear);
    }

    // ================== 日曆功能 (Calendar) ==================

    function changeCalendarMonth(offset) {
      currentCalDate.setMonth(currentCalDate.getMonth() + offset);
      renderCalendar();
    }

    function selectDate(dateStr) {
      const parts = dateStr.split('-');
      selectedCalDate = new Date(parts[0], parts[1] - 1, parts[2]);
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth(); // 0-11

      // 標題
      document.getElementById('calendar-month-title').innerText = `${year} 年 ${month + 1} 月`;

      // 該月第一天是星期幾 (0是週日，6是週六)
      const firstDay = new Date(year, month, 1).getDay(); 
      // 該月總共有幾天
      const daysInMonth = new Date(year, month + 1, 0).getDate(); 

      // 建立該月份的事件地圖 (以日期字串 YYYY-MM-DD 為 Key)
      const eventsMap = {};
      calculatedDividends.forEach(d => {
        if (d.exDate) {
          if (!eventsMap[d.exDate]) eventsMap[d.exDate] = { ex: [], pay: [] };
          eventsMap[d.exDate].ex.push(d);
        }
        if (d.payDate) {
          if (!eventsMap[d.payDate]) eventsMap[d.payDate] = { ex: [], pay: [] };
          eventsMap[d.payDate].pay.push(d);
        }
      });

      const todayStr = getLocalYMD(new Date());
      const selectedStr = getLocalYMD(selectedCalDate);

      let html = '';
      
      // 補齊前面的空白格子
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="h-[52px] bg-transparent"></div>`;
      }

      // 繪製日期格子
      for (let i = 1; i <= daysInMonth; i++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        const hasEx = eventsMap[dStr] && eventsMap[dStr].ex.length > 0;
        const hasPay = eventsMap[dStr] && eventsMap[dStr].pay.length > 0;

        let baseClasses = "h-[52px] rounded flex flex-col items-center justify-start py-1 cursor-pointer transition relative border ";

        // 決定格子的視覺狀態
        if (dStr === selectedStr) {
          baseClasses += "border-morandi-primary bg-slate-100 font-bold text-morandi-primary ";
        } else if (dStr === todayStr) {
          baseClasses += "border-morandi-accent bg-morandi-lightAccent text-morandi-accent font-bold ";
        } else {
          baseClasses += "border-slate-100 bg-white hover:bg-slate-50 text-slate-600 ";
        }

        // 事件點點
        let dotsHtml = '<div class="flex gap-1 mt-auto mb-0.5">';
        if (hasEx) dotsHtml += `<span class="w-1.5 h-1.5 rounded-full bg-amber-400" title="除息日"></span>`;
        if (hasPay) dotsHtml += `<span class="w-1.5 h-1.5 rounded-full bg-morandi-accent" title="發放日"></span>`;
        dotsHtml += '</div>';

        html += `
          <div class="${baseClasses}" onclick="selectDate('${dStr}')">
            <span>${i}</span>
            ${dotsHtml}
          </div>
        `;
      }

      document.getElementById('calendar-grid').innerHTML = html;
      renderCalendarEventsList();
    }

    function renderCalendarEventsList() {
      const listEl = document.getElementById('calendar-events-list');
      const selectedStr = getLocalYMD(selectedCalDate);

      // 過濾出選取當日的除息與發放事件
      const exEvents = calculatedDividends.filter(d => d.exDate === selectedStr);
      const payEvents = calculatedDividends.filter(d => d.payDate === selectedStr);

      let html = `<div class="text-sm font-bold text-morandi-primary mb-2 border-b pb-2 flex items-center justify-between">
                    <span>${selectedStr} 行程</span>
                  </div>`;

      if (exEvents.length === 0 && payEvents.length === 0) {
        html += `<div class="text-center py-6 text-slate-400">當日無配息或除息紀錄</div>`;
        listEl.innerHTML = html;
        return;
      }

      // 渲染除息事件
      if (exEvents.length > 0) {
        html += `<div class="text-[10px] font-bold text-amber-500 mt-3 mb-1.5 tracking-wider">除息日標示</div>`;
        exEvents.forEach(d => {
          html += `
            <div class="bg-amber-50 rounded-lg p-3 mb-2 flex justify-between items-center border border-amber-100/50">
              <div>
                <div class="font-bold text-slate-700 text-xs">${d.symbol} ${d.name}</div>
                <div class="text-[10px] text-slate-500 mt-0.5">預計配息：$${d.perShare} / 預定發放：${d.payDate}</div>
              </div>
            </div>
          `;
        });
      }

      // 渲染發放事件
      if (payEvents.length > 0) {
        html += `<div class="text-[10px] font-bold text-morandi-accent mt-3 mb-1.5 tracking-wider">股息入帳</div>`;
        payEvents.forEach(d => {
          html += `
            <div class="bg-morandi-lightAccent rounded-lg p-3 mb-2 flex justify-between items-center border border-morandi-accent/20">
              <div>
                <div class="font-bold text-slate-700 text-xs">${d.symbol} ${d.name}</div>
                <div class="text-[10px] text-slate-500 mt-0.5">除息日：${d.exDate}</div>
              </div>
              <div class="text-right">
                <div class="text-[10px] text-slate-500">預計入帳</div>
                <div class="text-sm font-bold text-morandi-accent">+$${d.totalPayout.toLocaleString()}</div>
              </div>
            </div>
          `;
        });
      }

      listEl.innerHTML = html;
    }
  </script>
</body>
</html>
