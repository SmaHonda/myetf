<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETF 股息資產管家</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            morandi: {
              bg: '#F4F5F7',
              card: '#FFFFFF',
              primary: '#2B3A4A',
              secondary: '#6B7C85',
              accent: '#5A8F7B',
              lightAccent: '#E8F0EC',
              border: '#E2E8F0',
              text: '#1E293B',
              muted: '#64748B'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F4F5F7;
      color: #1E293B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .active-tab {
      color: #2B3A4A;
      border-bottom: 2px solid #2B3A4A;
      font-weight: 600;
    }
  </style>
</head>
<body class="pb-20 max-w-md mx-auto min-h-screen shadow-lg relative bg-[#F4F5F7]">

  <!-- 頂部標題列 -->
  <header class="bg-morandi-primary text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
    <div>
      <h1 class="text-lg font-bold tracking-wide">ETF 股息資產管家</h1>
      <p class="text-xs text-slate-300">雲端同步狀態：<span id="sync-status" class="text-morandi-accent font-medium">連線正常</span></p>
    </div>
    <button onclick="fetchSheetData()" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded border border-slate-500 transition">
      重新整理
    </button>
  </header>

  <!-- 主頁面分頁切換選單 -->
  <nav class="bg-white border-b border-morandi-border sticky top-[57px] z-40 flex justify-around text-sm text-morandi-muted">
    <button id="tab-btn-dashboard" onclick="switchTab('dashboard')" class="py-3 px-2 active-tab">投資總覽</button>
    <button id="tab-btn-history" onclick="switchTab('history')" class="py-3 px-2">股息歷程</button>
    <button id="tab-btn-calendar" onclick="switchTab('calendar')" class="py-3 px-2">股息日曆</button>
    <button id="tab-btn-journal" onclick="switchTab('journal')" class="py-3 px-2">買賣紀錄</button>
  </nav>

  <!-- 主要內容區塊 -->
  <main class="p-4 space-y-4">

    <!-- 1. 投資總覽 (Dashboard) -->
    <section id="sec-dashboard" class="space-y-4">
      <!-- 總資產卡片 -->
      <div class="bg-morandi-primary text-white rounded-xl p-5 shadow-sm space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-xs text-slate-300">總投資價值 (估計)</span>
          <span class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-200">即時同步</span>
        </div>
        <div class="text-3xl font-bold tracking-tight" id="dash-total-value">$0</div>
        
        <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-700/60">
          <div>
            <div class="text-slate-400">總投入成本</div>
            <div class="text-sm font-semibold text-slate-100" id="dash-total-cost">$0</div>
          </div>
          <div>
            <div class="text-slate-400">歷史總配息 (預估)</div>
            <div class="text-sm font-semibold text-morandi-accent" id="dash-total-dividend">$0</div>
          </div>
        </div>
      </div>

      <!-- 配息頻率統計 -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-2">
        <h2 class="text-xs font-bold text-morandi-muted tracking-wider uppercase">持股標的分佈</h2>
        <div class="grid grid-cols-4 gap-2 text-center pt-1" id="holding-summary-counts">
          <div class="bg-slate-50 p-2 rounded">
            <div class="text-[10px] text-slate-500">持股筆數</div>
            <div class="text-sm font-bold text-morandi-primary" id="count-holdings">0</div>
          </div>
          <div class="bg-slate-50 p-2 rounded">
            <div class="text-[10px] text-slate-500">總股數</div>
            <div class="text-sm font-bold text-morandi-primary" id="count-shares">0</div>
          </div>
          <div class="bg-slate-50 p-2 rounded">
            <div class="text-[10px] text-slate-500">已領息次數</div>
            <div class="text-sm font-bold text-morandi-primary" id="count-div-times">0</div>
          </div>
          <div class="bg-slate-50 p-2 rounded">
            <div class="text-[10px] text-slate-500">平均月領息</div>
            <div class="text-sm font-bold text-morandi-primary" id="avg-monthly-div">$0</div>
          </div>
        </div>
      </div>

      <!-- 資產佔比圓餅圖 -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-3">
        <h2 class="text-xs font-bold text-morandi-muted tracking-wider uppercase">持股佔比分析</h2>
        <div class="w-48 h-48 mx-auto">
          <canvas id="chart-portfolio"></canvas>
        </div>
      </div>
    </section>

    <!-- 2. 股息歷程 (History) -->
    <section id="sec-history" class="space-y-4 hidden">
      <!-- 年份選擇列 -->
      <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-morandi-border">
        <span class="text-xs font-bold text-morandi-primary">選擇統計年份</span>
        <select id="history-year-select" onchange="renderHistory()" class="text-xs border border-slate-200 rounded px-2 py-1 bg-slate-50 font-medium">
          <option value="2026">2026 年</option>
          <option value="2025">2025 年</option>
          <option value="2024">2024 年</option>
          <option value="2023">2023 年</option>
          <option value="2022">2022 年</option>
          <option value="2021">2021 年</option>
          <option value="2020">2020 年</option>
        </select>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-morandi-primary" id="history-chart-title">各月份領息統計</h2>
          <span class="text-xs text-morandi-accent font-semibold" id="history-year-total">該年總計: $0</span>
        </div>
        <div class="h-52">
          <canvas id="chart-dividend-history"></canvas>
        </div>
      </div>

      <!-- 月份配息明細時間軸卡片區 -->
      <div class="space-y-3" id="history-timeline-list">
        <!-- 動態渲染歷史領息細節 -->
      </div>
    </section>

    <!-- 3. 股息日曆 (Calendar) -->
    <section id="sec-calendar" class="space-y-4 hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-morandi-primary" id="calendar-month-title">2026 年 07 月</h2>
          <div class="space-x-1 text-xs">
            <button onclick="changeMonth(-1)" class="px-2 py-1 bg-slate-100 rounded text-slate-600 hover:bg-slate-200">上個月</button>
            <button onclick="changeMonth(1)" class="px-2 py-1 bg-slate-100 rounded text-slate-600 hover:bg-slate-200">下個月</button>
          </div>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 font-medium py-1">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs" id="calendar-grid">
          <!-- 動態生成日曆格子 -->
        </div>
      </div>

      <!-- 當月事件預告清單 -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-2">
        <h3 class="text-xs font-bold text-morandi-muted uppercase tracking-wider">本月配息發放紀錄/預告</h3>
        <div id="calendar-events-list" class="space-y-2 text-xs divide-y divide-slate-100">
          <p class="text-slate-400 py-2">載入配息數據中...</p>
        </div>
      </div>
    </section>

    <!-- 4. 買賣紀錄管理 (Journal) -->
    <section id="sec-journal" class="space-y-4 hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-3">
        <h2 class="text-sm font-bold text-morandi-primary flex justify-between items-center">
          新增買賣交易紀錄
          <span class="text-[10px] font-normal text-slate-400">寫入 Google 試算表</span>
        </h2>
        <form id="trade-form" onsubmit="submitTrade(event)" class="space-y-3 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-500 mb-1">交易日期</label>
              <input type="date" id="input-date" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
            <div>
              <label class="block text-slate-500 mb-1">動作</label>
              <select id="input-action" class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary bg-white">
                <option value="買進">買進</option>
                <option value="賣出">賣出</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-500 mb-1">股票代號</label>
              <input type="text" id="input-symbol" placeholder="例: 00878" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
            <div>
              <label class="block text-slate-500 mb-1">股票名稱</label>
              <input type="text" id="input-name" placeholder="例: 國泰永續高股息" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-slate-500 mb-1">成交單價</label>
              <input type="number" step="0.01" id="input-price" placeholder="22.5" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
            <div>
              <label class="block text-slate-500 mb-1">股數</label>
              <input type="number" id="input-shares" placeholder="1000" required class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
            <div>
              <label class="block text-slate-500 mb-1">手續費</label>
              <input type="number" id="input-fee" placeholder="0" class="w-full border border-slate-200 p-2 rounded focus:outline-none focus:border-morandi-primary">
            </div>
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-morandi-primary text-white py-2.5 rounded font-medium shadow-sm hover:bg-slate-800 transition">
            儲存紀錄至雲端試算表
          </button>
        </form>
      </div>

      <!-- 歷史交易清單 -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-morandi-border space-y-3">
        <h2 class="text-sm font-bold text-morandi-primary">已同步買賣紀錄</h2>
        <div id="journal-list" class="space-y-2 text-xs divide-y divide-slate-100">
          <p class="text-slate-400 text-center py-4">連線中，載入資料庫中...</p>
        </div>
      </div>
    </section>

  </main>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrlB_2SXpITgtdH_yuMAvOp4Z_KCpoej3UvnBYWcnl1RWYWF7ddbOpE2xbr3CIoZt3/exec";

    // 常用台股高股息 ETF 歷史除息資料庫（每股配息與發放日期）
    const ETF_DIVIDEND_DATABASE = {
      "00878": [
        { exDate: "2020-11-17", payDate: "2020-12-16", amount: 0.05 },
        { exDate: "2021-02-22", payDate: "2021-03-23", amount: 0.15 },
        { exDate: "2021-05-18", payDate: "2021-06-18", amount: 0.25 },
        { exDate: "2021-08-17", payDate: "2021-09-17", amount: 0.30 },
        { exDate: "2021-11-16", payDate: "2021-12-17", amount: 0.28 },
        { exDate: "2022-02-22", payDate: "2022-03-25", amount: 0.30 },
        { exDate: "2022-05-18", payDate: "2022-06-21", amount: 0.32 },
        { exDate: "2022-08-16", payDate: "2022-09-19", amount: 0.28 },
        { exDate: "2022-11-16", payDate: "2022-12-19", amount: 0.28 },
        { exDate: "2023-02-16", payDate: "2023-03-22", amount: 0.27 },
        { exDate: "2023-05-17", payDate: "2023-06-12", amount: 0.27 },
        { exDate: "2023-08-16", payDate: "2023-09-11", amount: 0.35 },
        { exDate: "2023-11-16", payDate: "2023-12-12", amount: 0.35 },
        { exDate: "2024-02-27", payDate: "2024-03-25", amount: 0.40 },
        { exDate: "2024-05-17", payDate: "2024-06-13", amount: 0.51 },
        { exDate: "2024-08-16", payDate: "2024-09-11", amount: 0.55 },
        { exDate: "2024-11-18", payDate: "2024-12-12", amount: 0.55 },
        { exDate: "2025-02-18", payDate: "2025-03-18", amount: 0.55 },
        { exDate: "2025-05-19", payDate: "2025-06-16", amount: 0.55 },
        { exDate: "2025-08-18", payDate: "2025-09-15", amount: 0.55 },
        { exDate: "2025-11-17", payDate: "2025-12-15", amount: 0.55 },
        { exDate: "2026-02-24", payDate: "2026-03-23", amount: 0.55 },
        { exDate: "2026-05-19", payDate: "2026-06-16", amount: 0.55 }
      ]
    };

    let rawTradeData = [];
    let calculatedDividends = [];
    let portfolioChart = null;
    let historyChart = null;

    window.onload = function() {
      document.getElementById('input-date').valueAsDate = new Date();
      fetchSheetData();
    };

    function switchTab(tabName) {
      ['dashboard', 'history', 'calendar', 'journal'].forEach(tab => {
        document.getElementById(`sec-${tab}`).classList.add('hidden');
        document.getElementById(`tab-btn-${tab}`).classList.remove('active-tab');
      });
      document.getElementById(`sec-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${tabName}`).classList.add('active-tab');

      if (tabName === 'dashboard') renderDashboard();
      if (tabName === 'history') renderHistory();
      if (tabName === 'calendar') renderCalendar();
    }

    async function fetchSheetData() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = "同步中...";
      statusEl.className = "text-amber-400 font-medium";

      try {
        const res = await fetch(GAS_API_URL, { method: 'GET', redirect: 'follow' });
        rawTradeData = await res.json();
        
        statusEl.innerText = "同步完成";
        statusEl.className = "text-morandi-accent font-medium";

        calculateUserDividends();
        renderJournalList();
        renderDashboard();
      } catch (err) {
        console.error("同步失敗：", err);
        statusEl.innerText = "同步失敗";
        statusEl.className = "text-rose-400 font-medium";
      }
    }

    // 計算使用者依交易歷史實際領到的配息金額
    function calculateUserDividends() {
      calculatedDividends = [];

      rawTradeData.forEach(trade => {
        const symbol = String(trade['股票代號']).padStart(5, '0').slice(-5);
        const divRecords = ETF_DIVIDEND_DATABASE[symbol] || ETF_DIVIDEND_DATABASE[trade['股票代號']];

        if (divRecords && trade['動作'] === '買進') {
          const buyDate = new Date(trade['日期']);
          const shares = Number(trade['股數']) || 0;

          divRecords.forEach(div => {
            const exDate = new Date(div.exDate);
            // 如果買進日期在除息日之前（或當天），即可參與該次配息
            if (buyDate <= exDate) {
              const totalPayout = Math.round(shares * div.amount);
              calculatedDividends.push({
                symbol: symbol,
                name: trade['股票名稱'] || symbol,
                exDate: div.exDate,
                payDate: div.payDate,
                year: div.payDate.split('-')[0],
                month: div.payDate.split('-')[1],
                shares: shares,
                perShare: div.amount,
                totalPayout: totalPayout
              });
            }
          });
        }
      });
    }

    function submitTrade(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "寫入中...";

      const payload = {
        date: document.getElementById('input-date').value,
        action: document.getElementById('input-action').value,
        symbol: document.getElementById('input-symbol').value.trim(),
        name: document.getElementById('input-name').value.trim(),
        price: document.getElementById('input-price').value,
        shares: document.getElementById('input-shares').value,
        fee: document.getElementById('input-fee').value || 0
      };

      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("成功新增交易紀錄！");
        document.getElementById('trade-form').reset();
        document.getElementById('input-date').valueAsDate = new Date();
        fetchSheetData();
      })
      .catch(err => {
        alert("寫入失敗，請檢查網路連線。");
        console.error(err);
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "儲存紀錄至雲端試算表";
      });
    }

    function renderJournalList() {
      const container = document.getElementById('journal-list');
      if (!rawTradeData || rawTradeData.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-center py-4">目前 Google 試算表中無交易資料</p>`;
        return;
      }

      container.innerHTML = rawTradeData.slice().reverse().map(item => `
        <div class="pt-2 flex justify-between items-center">
          <div>
            <div class="font-bold text-morandi-primary">${item['股票代號']} ${item['股票名稱'] || ''}</div>
            <div class="text-[10px] text-slate-400">${item['日期']} | <span class="${item['動作'] === '買進' ? 'text-emerald-600' : 'text-rose-600'} font-medium">${item['動作']}</span></div>
          </div>
          <div class="text-right">
            <div class="font-semibold text-morandi-text">$${Number(item['單價']).toLocaleString()} × ${Number(item['股數']).toLocaleString()}股</div>
            <div class="text-[10px] text-slate-400">手續費: $${Number(item['手續費'] || 0)}</div>
          </div>
        </div>
      `).join('');
    }

    function renderDashboard() {
      let totalCost = 0;
      let totalShares = 0;
      let holdings = {};

      rawTradeData.forEach(item => {
        const symbol = String(item['股票代號']);
        const shares = Number(item['股數']) || 0;
        const price = Number(item['單價']) || 0;
        const fee = Number(item['手續費']) || 0;

        if (!holdings[symbol]) holdings[symbol] = { shares: 0, cost: 0, name: item['股票名稱'] };

        if (item['動作'] === '買進') {
          holdings[symbol].shares += shares;
          holdings[symbol].cost += (shares * price) + fee;
          totalCost += (shares * price) + fee;
          totalShares += shares;
        }
      });

      const totalHistoricalDiv = calculatedDividends.reduce((sum, d) => sum + d.totalPayout, 0);

      document.getElementById('dash-total-cost').innerText = `$${Math.round(totalCost).toLocaleString()}`;
      document.getElementById('dash-total-value').innerText = `$${Math.round(totalCost).toLocaleString()}`;
      document.getElementById('dash-total-dividend').innerText = `$${totalHistoricalDiv.toLocaleString()}`;

      document.getElementById('count-holdings').innerText = Object.keys(holdings).length;
      document.getElementById('count-shares').innerText = totalShares.toLocaleString();
      document.getElementById('count-div-times').innerText = calculatedDividends.length;
      document.getElementById('avg-monthly-div').innerText = `$${Math.round(totalHistoricalDiv / 12).toLocaleString()}`;

      const labels = Object.keys(holdings).filter(s => holdings[s].shares > 0);
      const dataValues = labels.map(s => holdings[s].cost);

      const ctx = document.getElementById('chart-portfolio').getContext('2d');
      if (portfolioChart) portfolioChart.destroy();

      portfolioChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: ['#2B3A4A', '#5A8F7B', '#6B7C85', '#94A3B8', '#CBD5E1']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
          }
        }
      });
    }

    // 渲染股息歷程與年份選擇長條圖
    function renderHistory() {
      const selectedYear = document.getElementById('history-year-select').value;
      const monthlyPayouts = Array(12).fill(0);
      let yearTotal = 0;

      const yearDividends = calculatedDividends.filter(d => d.year === selectedYear);

      yearDividends.forEach(d => {
        const m = parseInt(d.month, 10) - 1;
        if (m >= 0 && m < 12) {
          monthlyPayouts[m] += d.totalPayout;
          yearTotal += d.totalPayout;
        }
      });

      document.getElementById('history-year-total').innerText = `${selectedYear} 總計: $${yearTotal.toLocaleString()}`;

      const ctx = document.getElementById('chart-dividend-history').getContext('2d');
      if (historyChart) historyChart.destroy();

      historyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
          datasets: [{
            label: `${selectedYear} 實領配息 (元)`,
            data: monthlyPayouts,
            backgroundColor: '#5A8F7B',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, grid: { color: '#F1F5F9' } },
            x: { grid: { display: false } }
          },
          plugins: { legend: { display: false } }
        }
      });

      // 渲染歷史時間軸明細
      const timelineEl = document.getElementById('history-timeline-list');
      if (yearDividends.length === 0) {
        timelineEl.innerHTML = `<p class="text-slate-400 text-center py-4 text-xs">該年份無領息紀錄</p>`;
        return;
      }

      timelineEl.innerHTML = yearDividends.map(d => `
        <div class="bg-white rounded-xl p-3 shadow-sm border border-morandi-border flex justify-between items-center text-xs">
          <div>
            <div class="font-bold text-morandi-primary">${d.symbol} ${d.name}</div>
            <div class="text-[10px] text-slate-400">發放日：${d.payDate} (除息：${d.exDate})</div>
            <div class="text-[10px] text-slate-500">每股配息 $${d.perShare} × ${d.shares.toLocaleString()} 股</div>
          </div>
          <div class="text-right">
            <div class="text-sm font-bold text-morandi-accent">+$${d.totalPayout.toLocaleString()}</div>
            <div class="text-[10px] bg-morandi-lightAccent text-morandi-accent px-1.5 py-0.5 rounded inline-block mt-1">已入帳</div>
          </div>
        </div>
      `).join('');
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      let html = '';
      for (let i = 1; i <= 31; i++) {
        const isCurrent = i === 15;
        html += `
          <div class="h-9 border border-slate-100 rounded p-1 ${isCurrent ? 'bg-morandi-lightAccent border-morandi-accent font-bold text-morandi-accent' : 'bg-slate-50'}">
            ${i}
          </div>
        `;
      }
      grid.innerHTML = html;
    }

    function changeMonth(delta) {
      alert("月份切換功能預留中！");
    }
  </script>
</body>
</html>
